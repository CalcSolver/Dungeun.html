<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playful World Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #gameContainer { position: relative; width: 800px; height: 600px; background: #5c94fc; border: 4px solid #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    canvas { display: block; background: #87CEEB; }
    
    /* Inventory UI */
    #inventoryOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); display: none;
      justify-content: center; align-items: center; gap: 20px;
      backdrop-filter: blur(4px);
    }
    .inv-card {
      background: #2c2c3e; border: 3px solid #ffcc00; border-radius: 12px;
      padding: 16px; width: 280px; height: 380px; display: flex; flex-direction: column; align-items: center;
    }
    .inv-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #ffcc00; text-transform: uppercase; }
    .item-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
    .item-slot {
      width: 70px; height: 70px; background: #1e1e28; border: 2px dashed #555;
      border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 24px; cursor: pointer; position: relative; transition: all 0.2s;
    }
    .item-slot:hover { border-color: #ffcc00; background: #282838; }
    .item-slot.active { border: 2px solid #00ffcc; background: #224444; }
    .item-count { position: absolute; bottom: 2px; right: 6px; font-size: 11px; font-weight: bold; color: #fff; }
    
    /* Character Preview */
    #charCanvas { background: #1a1a24; border-radius: 8px; border: 2px solid #ffcc00; }
    
    /* HUD */
    #hud { position: absolute; top: 12px; left: 12px; font-weight: bold; font-size: 14px; background: rgba(0,0,0,0.5); padding: 8px 14px; border-radius: 20px; }
  </style>
</head>
<body>

<div id="gameContainer">
  <div id="hud">E: Inventory | Click/Space: Shoot Bow | Walk Right: Boat Ride</div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  
  <!-- Inventory Overlay -->
  <div id="inventoryOverlay">
    <!-- Character Showcase -->
    <div class="inv-card">
      <div class="inv-title">Character</div>
      <canvas id="charCanvas" width="180" height="260"></canvas>
    </div>
    
    <!-- Minimal Items Grid -->
    <div class="inv-card">
      <div class="inv-title">Bag</div>
      <div class="item-grid" id="itemGrid"></div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const charCanvas = document.getElementById('charCanvas');
const charCtx = charCanvas.getContext('2d');

let keys = {};
let invOpen = false;
let secretUnlocked = false;

// Game State
const player = {
  x: 100, y: 450, vx: 0, vy: 0,
  width: 30, height: 50,
  inBoat: false,
  equippedArmour: false,
  equippedBow: false,
  facing: 1
};

const items = [
  { id: 'armour', icon: '🛡️', count: 1, name: 'Armor' },
  { id: 'bow', icon: '🏹', count: 1, name: 'Bow' },
  { id: 'arrow', icon: '🎯', count: 24, name: 'Arrows' },
  { id: 'boat', icon: '⛵', count: 1, name: 'Boat' },
  { id: 'key', icon: '🔑', count: 1, name: 'Secret Key' }
];

// Flying Arrows array
const arrows = [];
let boatBob = 0;

// Input Handling
window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  keys[key] = true;
  
  if (key === 'e') {
    invOpen = !invOpen;
    document.getElementById('inventoryOverlay').style.display = invOpen ? 'flex' : 'none';
    if (invOpen) drawCharacterPreview();
  }

  // Shoot Arrow on Spacebar
  if (key === ' ' && !invOpen) {
    shootArrow();
  }
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Shoot Arrow on Left Click
canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && !invOpen) {
    shootArrow();
  }
});

function shootArrow() {
  const arrowItem = items.find(i => i.id === 'arrow');
  if (player.equippedBow && arrowItem && arrowItem.count > 0) {
    arrowItem.count--;
    renderInventoryUI();
    
    arrows.push({
      x: player.x + (player.facing > 0 ? player.width + 5 : -5),
      y: (player.inBoat ? player.y - 10 + Math.sin(boatBob) * 4 : player.y) + 20,
      vx: player.facing * 10,
      vy: -1
    });
  }
}

// Render minimal inventory grid
function renderInventoryUI() {
  const grid = document.getElementById('itemGrid');
  grid.innerHTML = '';
  items.forEach(item => {
    const slot = document.createElement('div');
    let isActive = false;
    if (item.id === 'armour' && player.equippedArmour) isActive = true;
    if (item.id === 'bow' && player.equippedBow) isActive = true;

    slot.className = `item-slot ${isActive ? 'active' : ''}`;
    slot.innerHTML = `<span>${item.icon}</span><span class="item-count">${item.count}</span>`;
    slot.onclick = () => toggleEquip(item.id);
    grid.appendChild(slot);
  });
}
renderInventoryUI();

function toggleEquip(id) {
  if (id === 'armour') player.equippedArmour = !player.equippedArmour;
  if (id === 'bow') player.equippedBow = !player.equippedBow;
  renderInventoryUI();
  drawCharacterPreview();
}

// Character draw function for inventory preview
function drawCharacterPreview() {
  charCtx.clearRect(0, 0, charCanvas.width, charCanvas.height);
  
  // Platform
  charCtx.fillStyle = '#333';
  charCtx.fillRect(20, 220, 140, 10);

  // Body / Armour
  charCtx.fillStyle = player.equippedArmour ? '#c0c0c0' : '#ff7b7b';
  charCtx.fillRect(75, 110, 30, 60);

  // Head
  charCtx.fillStyle = '#ffdbac';
  charCtx.beginPath();
  charCtx.arc(90, 90, 20, 0, Math.PI * 2);
  charCtx.fill();

  // Helmet
  if (player.equippedArmour) {
    charCtx.fillStyle = '#a0a0a0';
    charCtx.fillRect(68, 68, 44, 12);
  }

  // Bow
  if (player.equippedBow) {
    charCtx.strokeStyle = '#8b4513';
    charCtx.lineWidth = 4;
    charCtx.beginPath();
    charCtx.arc(115, 140, 25, -Math.PI / 2, Math.PI / 2);
    charCtx.stroke();
  }
}

// Main Game Loop
function update() {
  // Movement
  if (!invOpen) {
    if (keys['a'] || keys['arrowleft']) { player.vx = -4; player.facing = -1; }
    else if (keys['d'] || keys['arrowright']) { player.vx = 4; player.facing = 1; }
    else player.vx = 0;

    if (keys['w'] && player.y >= 450) player.vy = -10;
  }

  // Gravity
  player.vy += 0.5;
  player.x += player.vx;
  player.y += player.vy;

  // Ground collision
  if (player.y > 450) { player.y = 450; player.vy = 0; }

  // Water & Boat logic
  const waterStart = 500;
  if (player.x > waterStart) {
    player.inBoat = true;
    player.y = 460;
  } else {
    player.inBoat = false;
  }

  // Boat bobbing animation
  boatBob += 0.08;

  // Secret Portal Collision
  if (player.x > 350 && player.x < 410 && player.y >= 440) {
    secretUnlocked = true;
  }

  // Update flying arrows
  for (let i = arrows.length - 1; i >= 0; i--) {
    let a = arrows[i];
    a.x += a.vx;
    a.y += a.vy;
    a.vy += 0.05; // Light arrow gravity

    // Remove arrows if off screen or hitting water/ground
    if (a.x < 0 || a.x > canvas.width || a.y > 500) {
      arrows.splice(i, 1);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Sky & Ground
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, canvas.width, 500);
  ctx.fillStyle = '#7ec850';
  ctx.fillRect(0, 500, 500, 100);

  // Draw Water Area
  ctx.fillStyle = '#2b65ec';
  ctx.fillRect(500, 500, 300, 100);

  // Secret Portal
  ctx.fillStyle = secretUnlocked ? '#9b59b6' : '#2c3e50';
  ctx.fillRect(360, 410, 40, 90);
  if (secretUnlocked) {
    ctx.fillStyle = '#f1c40f';
    ctx.font = '12px sans-serif';
    ctx.fillText('SECRET WORLD!', 335, 400);
  } else {
    ctx.fillStyle = '#fff';
    ctx.font = '12px sans-serif';
    ctx.fillText('Secret Portal', 345, 400);
  }

  // Boat Riding Animation & Player Render
  const floatOffset = Math.sin(boatBob) * 4;

  if (player.inBoat) {
    // Boat Hull
    ctx.fillStyle = '#8b4513';
    ctx.beginPath();
    ctx.moveTo(player.x - 20, 510 + floatOffset);
    ctx.lineTo(player.x + 50, 510 + floatOffset);
    ctx.lineTo(player.x + 40, 530 + floatOffset);
    ctx.lineTo(player.x - 10, 530 + floatOffset);
    ctx.closePath();
    ctx.fill();

    // Ripples
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x + 15, 532 + floatOffset, 25, 0, Math.PI);
    ctx.stroke();
  }

  // Render Player Character
  const renderY = player.inBoat ? player.y - 10 + floatOffset : player.y;
  
  // Body
  ctx.fillStyle = player.equippedArmour ? '#c0c0c0' : '#ff7b7b';
  ctx.fillRect(player.x, renderY, player.width, player.height);

  // Head
  ctx.fillStyle = '#ffdbac';
  ctx.fillRect(player.x + 5, renderY - 15, 20, 15);

  // Bow equipped
  if (player.equippedBow) {
    ctx.strokeStyle = '#8b4513';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x + (player.facing > 0 ? 30 : 0), renderY + 20, 15, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
  }

  // Render Flying Arrows
  ctx.fillStyle = '#5c3a21';
  ctx.strokeStyle = '#fff';
  arrows.forEach(a => {
    ctx.beginPath();
    ctx.arc(a.x, a.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(a.x - (a.vx * 1.5), a.y);
    ctx.stroke();
  });

  requestAnimationFrame(() => {
    update();
    draw();
  });
}

draw();
</script>
</body>
</html>
