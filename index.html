<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Explorer - Fixed Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #08080c; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
            border-radius: 8px; overflow: hidden; border: 3px solid #2a2a38;
        }
        canvas { display: block; background-color: #050508; cursor: crosshair; }
        #ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; pointer-events: none;
            font-size: 15px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); z-index: 5;
        }
        .bar-container {
            width: 180px; height: 16px; background: rgba(0,0,0,0.8);
            border: 2px solid #444; border-radius: 8px; overflow: hidden;
        }
        .hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #e74c3c, #c0392b); transition: width 0.1s linear; }
        
        #hud {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 10px;
            background: rgba(18, 18, 26, 0.95); border: 3px solid #4a4a5a;
            border-radius: 12px; padding: 8px 16px; z-index: 10;
        }
        .hud-slot {
            width: 90px; height: 50px; background: #14141e;
            border: 2px solid #38384a; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #3498db;
        }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; padding: 20px;
        }
        .modal h2 { color: #f1c40f; margin-bottom: 12px; text-transform: uppercase; }
        .grid-container { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 740px; margin-bottom: 15px; }
        .card {
            background: #1c1c26; border: 2px solid #38384a; border-radius: 8px;
            padding: 10px; width: 135px; text-align: center;
        }
        .card.locked { opacity: 0.4; }

        button {
            padding: 8px 14px; font-size: 11px; font-weight: bold;
            background: #3498db; color: white; border: none; border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #2980b9; }
        
        .controls-hint { margin-top: 10px; color: #777; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>

        <div id="ui">
            <div>
                <div style="font-size: 10px;">HEALTH (<span id="hp-text">100/100</span>)</div>
                <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div>
            </div>
            <div style="text-align: right;">
                <div>COINS: <span id="coins" style="color: #f1c40f;">0</span></div>
                <div id="region-ui" style="font-size: 12px; color: #2ecc71; margin-top: 2px;">REGION: GREEN REALM</div>
            </div>
        </div>

        <div id="hud">
            <div class="hud-slot">
                <span style="color:#888;">WEAPON</span>
                <span id="hud-weapon">Bow</span>
            </div>
            <div class="hud-slot" style="cursor: pointer;" onclick="usePotion()">
                <span style="color:#888;">POTION (1)</span>
                <span id="hud-potion" style="color: #2ecc71;">x1</span>
            </div>
        </div>

        <!-- Mission Board -->
        <div id="mission-modal" class="modal">
            <h2>Select Mission</h2>
            <div id="mission-list" class="grid-container"></div>
            <button onclick="closeModal('mission-modal')">Cancel</button>
        </div>

        <!-- Travel Harbor -->
        <div id="boat-modal" class="modal">
            <h2>Travel Harbor</h2>
            <div id="region-list" class="grid-container"></div>
            <button onclick="closeModal('boat-modal')">Stay Here</button>
        </div>

        <!-- Victory Modal -->
        <div id="victory-modal" class="modal">
            <h2 style="color: #2ecc71;">STAGE CLEARED!</h2>
            <p style="margin-bottom: 15px;">You cleared the cavern!</p>
            <button onclick="returnToLobby()">Return to Lobby</button>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over" class="modal">
            <h2 style="color: #e74c3c;">DEFEATED</h2>
            <button onclick="returnToLobby()">Respawn in Lobby</button>
        </div>
    </div>

    <div class="controls-hint">
        <strong>Controls:</strong> WASD / Arrows = Move | Left Click / Space = Shoot Bow/Attack | F = Talk to NPCs / Enter Portals
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let locationState = 'lobby'; 
        let currentRegion = 0; 
        let unlockedMission = 1; 
        let activeMission = 1;
        let coins = 100;

        let keys = {};
        let mouse = { x: 400, y: 300 };
        let lastTime = performance.now();

        const player = {
            x: 400, y: 300, radius: 14, speed: 200,
            maxHp: 100, hp: 100, attackTimer: 0, potions: 1, weapon: 'bow'
        };

        const REGIONS = [
            { name: "Forest Caverns", color: "#2ecc71", wallColor: "#1b4d2e", bg: "#0d2617" },
            { name: "Desert Catacombs", color: "#f39c12", wallColor: "#6e4a1f", bg: "#2d1f0d" },
            { name: "Volcano Depths", color: "#e74c3c", wallColor: "#5c1d1d", bg: "#2b0d0d" },
            { name: "Frost Ruins", color: "#3498db", wallColor: "#1d405c", bg: "#0d1f2d" }
        ];

        let npcs = [];
        let walls = [];
        let enemies = [];
        let arrows = [];
        let floatingTexts = [];
        let portal = null;

        const camera = { x: 0, y: 0 };

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'f') interactWithNPCs();
            if (e.code === 'Space') performAttack();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', e => { if (e.button === 0) performAttack(); });

        function setupLobby() {
            locationState = 'lobby';
            player.x = 400; player.y = 300; player.hp = player.maxHp;
            enemies = []; arrows = []; walls = []; portal = null;

            // Outer Bounds Walls
            walls.push({ x: 50, y: 50, w: 700, h: 20 });
            walls.push({ x: 50, y: 530, w: 700, h: 20 });
            walls.push({ x: 50, y: 50, w: 20, h: 500 });
            walls.push({ x: 730, y: 50, w: 20, h: 500 });

            // Lobby NPCs
            npcs = [
                { x: 200, y: 200, radius: 16, name: "Captain Roy (Missions)", type: "missions", color: "#f1c40f" },
                { x: 600, y: 200, radius: 16, name: "Sailor Pete (Travel)", type: "travel", color: "#3498db" },
                { x: 400, y: 150, radius: 16, name: "Bow Master", type: "weapon", color: "#e67e22" }
            ];

            updateUI();
        }

        function buildRegionCave() {
            walls = []; enemies = []; arrows = [];
            const rData = REGIONS[currentRegion];

            // Outer Boundary Walls (Fixes going through outer edges)
            walls.push({ x: 0, y: 0, w: 1200, h: 30 });
            walls.push({ x: 0, y: 870, w: 1200, h: 30 });
            walls.push({ x: 0, y: 0, w: 30, h: 900 });
            walls.push({ x: 1170, y: 0, w: 30, h: 900 });

            // Internal Solid Walls (Fixes clipping through map interior)
            walls.push({ x: 250, y: 150, w: 40, h: 400 });
            walls.push({ x: 500, y: 350, w: 400, h: 40 });
            walls.push({ x: 750, y: 100, w: 40, h: 350 });

            player.x = 100; player.y = 100;

            // Spawn Region-Exclusive Enemies
            for (let i = 0; i < 8; i++) {
                enemies.push({
                    x: 400 + Math.random() * 600,
                    y: 200 + Math.random() * 500,
                    radius: 15, hp: 60, maxHp: 60, damage: 12, speed: 70,
                    color: rData.color
                });
            }

            portal = { x: 1100, y: 800, radius: 25 };
        }

        function startMission(mNum) {
            activeMission = mNum;
            locationState = 'dungeon';
            closeModal('mission-modal');
            buildRegionCave();
            updateUI();
        }

        function interactWithNPCs() {
            if (locationState === 'lobby') {
                npcs.forEach(npc => {
                    if (Math.hypot(player.x - npc.x, player.y - npc.y) < player.radius + npc.radius + 30) {
                        if (npc.type === 'missions') openMissionBoard();
                        if (npc.type === 'travel') openBoatHarbor();
                        if (npc.type === 'weapon') {
                            player.weapon = player.weapon === 'bow' ? 'sword' : 'bow';
                            addFloatingText(player.x, player.y, `Switched to ${player.weapon.toUpperCase()}!`, '#f1c40f', 18);
                            updateUI();
                        }
                    }
                });
            } else if (locationState === 'dungeon' && portal) {
                if (Math.hypot(player.x - portal.x, player.y - portal.y) < player.radius + portal.radius) {
                    locationState = 'clear';
                    coins += 50;
                    if (activeMission === unlockedMission) unlockedMission++;
                    openModal('victory-modal');
                }
            }
        }

        function performAttack() {
            if (locationState !== 'dungeon' || player.attackTimer > 0) return;
            player.attackTimer = 0.3;

            if (player.weapon === 'bow') {
                // Shoot Arrow in Direction of Mouse
                const worldMx = mouse.x + camera.x;
                const worldMy = mouse.y + camera.y;
                const angle = Math.atan2(worldMy - player.y, worldMx - player.x);
                
                arrows.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(angle) * 500,
                    vy: Math.sin(angle) * 500,
                    radius: 4, damage: 30
                });
            } else {
                // Melee Sword Swing
                enemies.forEach(e => {
                    if (Math.hypot(e.x - player.x, e.y - player.y) < 60) {
                        e.hp -= 40;
                        addFloatingText(e.x, e.y, "-40", "#e74c3c", 16);
                    }
                });
            }
        }

        function checkWallCollision(newX, newY) {
            for (let w of walls) {
                if (newX + player.radius > w.x && newX - player.radius < w.x + w.w &&
                    newY + player.radius > w.y && newY - player.radius < w.y + w.h) {
                    return true; // Collided with solid wall
                }
            }
            return false;
        }

        function update(dt) {
            if (player.attackTimer > 0) player.attackTimer -= dt;

            // Player Movement
            let moveX = 0, moveY = 0;
            if (keys['w'] || keys['arrowup']) moveY -= 1;
            if (keys['s'] || keys['arrowdown']) moveY += 1;
            if (keys['a'] || keys['arrowleft']) moveX -= 1;
            if (keys['d'] || keys['arrowright']) moveX += 1;

            if (moveX !== 0 || moveY !== 0) {
                const len = Math.hypot(moveX, moveY);
                const nextX = player.x + (moveX / len) * player.speed * dt;
                const nextY = player.y + (moveY / len) * player.speed * dt;

                // Axis Collision Prevention (Stops Wall Clipping)
                if (!checkWallCollision(nextX, player.y)) player.x = nextX;
                if (!checkWallCollision(player.x, nextY)) player.y = nextY;
            }

            // Camera Following
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;

            // Arrow Flying & Hit Detection
            arrows.forEach((a, aIdx) => {
                a.x += a.vx * dt; a.y += a.vy * dt;

                // Arrow hits wall
                if (checkWallCollision(a.x, a.y)) {
                    arrows.splice(aIdx, 1);
                    return;
                }

                // Arrow hits enemy
                enemies.forEach((e) => {
                    if (Math.hypot(e.x - a.x, e.y - a.y) < e.radius + a.radius) {
                        e.hp -= a.damage;
                        addFloatingText(e.x, e.y, `-${a.damage}`, '#e74c3c', 16);
                        arrows.splice(aIdx, 1);
                    }
                });
            });

            // Enemy Chase & Attack Logic
            enemies.forEach((e, idx) => {
                if (e.hp <= 0) {
                    enemies.splice(idx, 1);
                    return;
                }
                const dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < 300) {
                    e.x += ((player.x - e.x) / dist) * e.speed * dt;
                    e.y += ((player.y - e.y) / dist) * e.speed * dt;
                }
                if (dist < player.radius + e.radius) {
                    player.hp -= e.damage * dt;
                    updateUI();
                    if (player.hp <= 0) {
                        locationState = 'dead';
                        openModal('game-over');
                    }
                }
            });

            // Text Animations
            floatingTexts.forEach((ft, idx) => {
                ft.y -= 20 * dt; ft.life -= dt;
                if (ft.life <= 0) floatingTexts.splice(idx, 1);
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            const bg = locationState === 'lobby' ? '#0d0d14' : REGIONS[currentRegion].bg;
            ctx.fillStyle = bg;
            ctx.fillRect(camera.x, camera.y, canvas.width, canvas.height);

            // Draw Walls
            ctx.fillStyle = locationState === 'lobby' ? '#2c2c3e' : REGIONS[currentRegion].wallColor;
            walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

            // Draw NPCs (Lobby)
            if (locationState === 'lobby') {
                npcs.forEach(npc => {
                    ctx.fillStyle = npc.color;
                    ctx.beginPath(); ctx.arc(npc.x, npc.y, npc.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = '11px Segoe UI'; ctx.textAlign = 'center';
                    ctx.fillText(npc.name, npc.x, npc.y - 22);
                });
            }

            // Draw Exit Portal
            if (locationState === 'dungeon' && portal) {
                ctx.fillStyle = '#9b59b6';
                ctx.beginPath(); ctx.arc(portal.x, portal.y, portal.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'center';
                ctx.fillText("Exit Portal (F)", portal.x, portal.y - 30);
            }

            // Draw Player
            ctx.fillStyle = '#3498db';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();

            // Draw Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
            });

            // Draw Arrows
            ctx.fillStyle = '#f1c40f';
            arrows.forEach(a => {
                ctx.beginPath(); ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2); ctx.fill();
            });

            // Floating Combat Text
            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color; ctx.font = `bold ${ft.size}px Segoe UI`;
                ctx.globalAlpha = ft.life;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1.0;
            });

            ctx.restore();
        }

        function updateUI() {
            // FIXED Healthbar Calculations
            const hpPercent = Math.max(0, Math.min(100, (player.hp / player.maxHp) * 100));
            document.getElementById('hp-bar').style.width = `${hpPercent}%`;
            document.getElementById('hp-text').innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
            document.getElementById('coins').innerText = coins;
            document.getElementById('hud-weapon').innerText = player.weapon.toUpperCase();
            document.getElementById('region-ui').innerText = `REGION: ${REGIONS[currentRegion].name.toUpperCase()}`;
        }

        function addFloatingText(x, y, text, color, size) {
            floatingTexts.push({ x, y, text, color, size, life: 1.0 });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openMissionBoard() {
            const list = document.getElementById('mission-list'); list.innerHTML = '';
            for (let m = 1; m <= 5; m++) {
                const isUnlocked = m <= unlockedMission;
                const card = document.createElement('div'); card.className = `card ${isUnlocked ? '' : 'locked'}`;
                card.innerHTML = `
                    <h4>Mission ${m}</h4>
                    <button ${isUnlocked ? '' : 'disabled'} onclick="startMission(${m})">${isUnlocked ? 'Enter' : 'Locked'}</button>
                `;
                list.appendChild(card);
            }
            openModal('mission-modal');
        }

        function openBoatHarbor() {
            const list = document.getElementById('region-list'); list.innerHTML = '';
            REGIONS.forEach((r, idx) => {
                const isCurrent = idx === currentRegion;
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `
                    <h4 style="color:${r.color}">${r.name}</h4>
                    <button ${isCurrent ? 'disabled' : ''} onclick="setRegion(${idx})">${isCurrent ? 'Current' : 'Travel'}</button>
                `;
                list.appendChild(card);
            });
            openModal('boat-modal');
        }

        function setRegion(idx) {
            currentRegion = idx; closeModal('boat-modal'); updateUI();
        }

        function usePotion() {
            if (player.potions > 0 && player.hp < player.maxHp) {
                player.potions--;
                player.hp = Math.min(player.maxHp, player.hp + 40);
                updateUI();
            }
        }

        function returnToLobby() {
            closeModal('victory-modal'); closeModal('game-over');
            setupLobby();
        }

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            update(dt);
            render();
            requestAnimationFrame(gameLoop);
        }

        setupLobby();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
