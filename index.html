<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Dungeon Explorer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #0d0d13;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Game Header & UI */
        #ui-bar {
            width: 100%;
            max-width: 600px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px 8px 0 0;
            font-size: 14px;
            font-weight: bold;
        }

        .region-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* Game Canvas Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 60vh;
            max-width: 600px;
            max-height: 400px;
            background: #000;
            border: 2px solid #2a2a38;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* Mobile Controls Overlay */
        #mobile-controls {
            width: 100%;
            max-width: 600px;
            height: 25vh;
            max-height: 180px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(15, 15, 22, 0.9);
            border-radius: 0 0 8px 8px;
        }

        /* D-Pad Layout */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(3, 45px);
            gap: 4px;
        }

        .btn {
            background: #222230;
            border: 2px solid #444455;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #11111a;
        }

        .btn:active, .btn.active {
            background: #f1c40f;
            color: #000;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #11111a;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 14px;
        }

        .btn-attack { background: #e74c3c; border-color: #ff7675; }
        .btn-interact { background: #3498db; border-color: #74b9ff; }
    </style>
</head>
<body>

    <div id="ui-bar">
        <div>HP: <span id="hp-val" style="color: #e74c3c;">100</span></div>
        <div id="region-tag" class="region-badge" style="background: #e74c3c;">🔥 VOLCANO</div>
        <div>SCORE: <span id="score-val" style="color: #f1c40f;">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- On-Screen Touch Controls -->
    <div id="mobile-controls">
        <div class="dpad">
            <div class="btn btn-up" id="btn-u">▲</div>
            <div class="btn btn-left" id="btn-l">◀</div>
            <div class="btn btn-down" id="btn-d">▼</div>
            <div class="btn btn-right" id="btn-r">▶</div>
        </div>
        <div class="action-btns">
            <div class="btn action-btn btn-interact" id="btn-i">USE</div>
            <div class="btn action-btn btn-attack" id="btn-a">ATK</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 260;

        // Game State
        let score = 0;
        let hp = 100;
        let currentRegion = 0;

        const regions = [
            { name: '🔥 VOLCANO', color: '#e74c3c', bg: '#1a0505' },
            { name: '❄️ FROST', color: '#0984e3', bg: '#05131a' },
            { name: '☣️ SWAMP', color: '#10ac84', bg: '#051a0e' },
            { name: '💀 CRYPT', color: '#5f27cd', bg: '#12051a' }
        ];

        // Player Object
        const player = {
            x: 50,
            y: 110,
            width: 16,
            height: 16,
            speed: 2,
            color: '#f1c40f'
        };

        // Key/Touch State Tracking
        const keys = { Up: false, Down: false, Left: false, Right: false };

        // Keyboard Controls
        window.addEventListener('keydown', (e) => handleKey(e.key, true));
        window.addEventListener('keyup', (e) => handleKey(e.key, false));

        function handleKey(key, isDown) {
            if (['ArrowUp', 'w', 'W'].includes(key)) keys.Up = isDown;
            if (['ArrowDown', 's', 'S'].includes(key)) keys.Down = isDown;
            if (['ArrowLeft', 'a', 'A'].includes(key)) keys.Left = isDown;
            if (['ArrowRight', 'd', 'D'].includes(key)) keys.Right = isDown;
        }

        // Mobile Touch Listeners
        function bindTouch(btnId, keyName) {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); });
            btn.addEventListener('mousedown', () => { keys[keyName] = true; btn.classList.add('active'); });
            btn.addEventListener('mouseup', () => { keys[keyName] = false; btn.classList.remove('active'); });
        }

        bindTouch('btn-u', 'Up');
        bindTouch('btn-d', 'Down');
        bindTouch('btn-l', 'Left');
        bindTouch('btn-r', 'Right');

        // Action Buttons
        document.getElementById('btn-a').addEventListener('click', attack);
        document.getElementById('btn-i').addEventListener('click', switchRegion);

        function attack() {
            score += 10;
            document.getElementById('score-val').innerText = score;
        }

        function switchRegion() {
            currentRegion = (currentRegion + 1) % regions.length;
            const reg = regions[currentRegion];
            const tag = document.getElementById('region-tag');
            tag.innerText = reg.name;
            tag.style.background = reg.color;
        }

        // Game Loop
        function update() {
            if (keys.Up && player.y > 0) player.y -= player.speed;
            if (keys.Down && player.y < canvas.height - player.height) player.y += player.speed;
            if (keys.Left && player.x > 0) player.x -= player.speed;
            if (keys.Right && player.x < canvas.width - player.width) player.x += player.speed;
        }

        function render() {
            // Draw Map Background
            ctx.fillStyle = regions[currentRegion].bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid Lines
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let x = 0; x < canvas.width; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
