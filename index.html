<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playful World Engine - Top Down</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #gameContainer { position: relative; width: 800px; height: 600px; background: #2e7d32; border: 4px solid #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    canvas { display: block; background: #2e7d32; }
    
    /* Inventory UI */
    #inventoryOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); display: none;
      justify-content: center; align-items: center; gap: 20px;
      backdrop-filter: blur(4px); z-index: 10;
    }
    .inv-card {
      background: #2c2c3e; border: 3px solid #ffcc00; border-radius: 12px;
      padding: 16px; width: 280px; height: 380px; display: flex; flex-direction: column; align-items: center;
    }
    .inv-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #ffcc00; text-transform: uppercase; }
    .item-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
    .item-slot {
      width: 70px; height: 70px; background: #1e1e28; border: 2px dashed #555;
      border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 24px; cursor: pointer; position: relative; transition: all 0.2s;
    }
    .item-slot:hover { border-color: #ffcc00; background: #282838; }
    .item-slot.active { border: 2px solid #00ffcc; background: #224444; }
    .item-count { position: absolute; bottom: 2px; right: 6px; font-size: 11px; font-weight: bold; color: #fff; }
    
    /* Character Preview */
    #charCanvas { background: #1a1a24; border-radius: 8px; border: 2px solid #ffcc00; }
    
    /* HUD */
    #hud { position: absolute; top: 12px; left: 12px; font-weight: bold; font-size: 14px; background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 20px; pointer-events: none; z-index: 5; }
  </style>
</head>
<body>

<div id="gameContainer">
  <div id="hud">WASD: Move | E: Inventory | Click/Space: Shoot | Walk to Water for Side-View Boat</div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  
  <!-- Inventory Overlay -->
  <div id="inventoryOverlay">
    <div class="inv-card">
      <div class="inv-title">Character</div>
      <canvas id="charCanvas" width="180" height="260"></canvas>
    </div>
    
    <div class="inv-card">
      <div class="inv-title">Bag</div>
      <div class="item-grid" id="itemGrid"></div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const charCanvas = document.getElementById('charCanvas');
const charCtx = charCanvas.getContext('2d');

let keys = {};
let invOpen = false;
let secretUnlocked = false;

// Game State
const player = {
  x: 150, y: 300,
  speed: 3.5,
  radius: 18,
  angle: 0, // In radians for 360 rotation aim
  inWater: false,
  equippedArmour: false,
  equippedBow: false
};

const items = [
  { id: 'armour', icon: '🛡️', count: 1 },
  { id: 'bow', icon: '🏹', count: 1 },
  { id: 'arrow', icon: '🎯', count: 30 },
  { id: 'boat', icon: '⛵', count: 1 },
  { id: 'key', icon: '🔑', count: 1 }
];

// Target Dummies in the top-down world
const targets = [
  { x: 300, y: 120, hit: false },
  { x: 300, y: 480, hit: false }
];

const arrows = [];
let boatBob = 0;
let mouseX = 0, mouseY = 0;

// Input Handling
window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  keys[key] = true;
  
  if (key === 'e') {
    invOpen = !invOpen;
    document.getElementById('inventoryOverlay').style.display = invOpen ? 'flex' : 'none';
    if (invOpen) drawCharacterPreview();
  }

  if (key === ' ' && !invOpen) shootArrow();
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && !invOpen) shootArrow();
});

function shootArrow() {
  const arrowItem = items.find(i => i.id === 'arrow');
  if (player.equippedBow && arrowItem && arrowItem.count > 0 && !player.inWater) {
    arrowItem.count--;
    renderInventoryUI();
    
    arrows.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(player.angle) * 9,
      vy: Math.sin(player.angle) * 9,
      life: 100
    });
  }
}

function renderInventoryUI() {
  const grid = document.getElementById('itemGrid');
  grid.innerHTML = '';
  items.forEach(item => {
    const slot = document.createElement('div');
    let isActive = (item.id === 'armour' && player.equippedArmour) || (item.id === 'bow' && player.equippedBow);
    slot.className = `item-slot ${isActive ? 'active' : ''}`;
    slot.innerHTML = `<span>${item.icon}</span><span class="item-count">${item.count}</span>`;
    slot.onclick = () => toggleEquip(item.id);
    grid.appendChild(slot);
  });
}
renderInventoryUI();

function toggleEquip(id) {
  if (id === 'armour') player.equippedArmour = !player.equippedArmour;
  if (id === 'bow') player.equippedBow = !player.equippedBow;
  renderInventoryUI();
  drawCharacterPreview();
}

function drawCharacterPreview() {
  charCtx.clearRect(0, 0, charCanvas.width, charCanvas.height);
  charCtx.fillStyle = '#333';
  charCtx.fillRect(20, 220, 140, 10);

  // Body
  charCtx.fillStyle = player.equippedArmour ? '#c0c0c0' : '#ff7b7b';
  charCtx.fillRect(75, 110, 30, 60);

  // Head
  charCtx.fillStyle = '#ffdbac';
  charCtx.beginPath();
  charCtx.arc(90, 90, 20, 0, Math.PI * 2);
  charCtx.fill();

  if (player.equippedArmour) {
    charCtx.fillStyle = '#a0a0a0';
    charCtx.fillRect(68, 68, 44, 12);
  }

  if (player.equippedBow) {
    charCtx.strokeStyle = '#8b4513';
    charCtx.lineWidth = 4;
    charCtx.beginPath();
    charCtx.arc(115, 140, 25, -Math.PI / 2, Math.PI / 2);
    charCtx.stroke();
  }
}

// Game Updates
function update() {
  if (invOpen) return;

  // Water trigger region (Right side of screen)
  player.inWater = player.x > 580;

  if (player.inWater) {
    // Side-View Boat Mode Controls
    if (keys['a'] || keys['arrowleft']) player.x -= 3;
    if (keys['d'] || keys['arrowright']) player.x += 3;
    if (keys['w'] || keys['arrowup']) player.y -= 3;
    if (keys['s'] || keys['arrowdown']) player.y += 3;
    boatBob += 0.08;
  } else {
    // Top-Down Walking Controls
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    player.x += dx * player.speed;
    player.y += dy * player.speed;

    // Boundaries
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    // Calculate mouse angle for aiming
    player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

    // Secret Portal Unlock trigger
    if (Math.hypot(player.x - 400, player.y - 80) < 30) {
      secretUnlocked = true;
    }
  }

  // Update Arrows
  for (let i = arrows.length - 1; i >= 0; i--) {
    let a = arrows[i];
    a.x += a.vx;
    a.y += a.vy;
    a.life--;

    // Target Collisions
    targets.forEach(t => {
      if (!t.hit && Math.hypot(a.x - t.x, a.y - t.y) < 20) {
        t.hit = true;
        arrows.splice(i, 1);
      }
    });

    if (a.life <= 0 || a.x < 0 || a.x > canvas.width || a.y < 0 || a.y > canvas.height) {
      arrows.splice(i, 1);
    }
  }
}

// Rendering
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (player.inWater) {
    // --- SIDE-VIEW BOAT MODE ---
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0, 0, canvas.width, 400); // Sky
    ctx.fillStyle = '#2b65ec';
    ctx.fillRect(0, 400, canvas.width, 200); // Water

    const floatOffset = Math.sin(boatBob) * 5;
    const bx = player.x;
    const by = 430 + floatOffset;

    // Boat Hull
    ctx.fillStyle = '#8b4513';
    ctx.beginPath();
    ctx.moveTo(bx - 40, by);
    ctx.lineTo(bx + 50, by);
    ctx.lineTo(bx + 35, by + 30);
    ctx.lineTo(bx - 25, by + 30);
    ctx.closePath();
    ctx.fill();

    // Player in Boat (Side View)
    ctx.fillStyle = player.equippedArmour ? '#c0c0c0' : '#ff7b7b';
    ctx.fillRect(bx - 5, by - 35, 20, 35);
    ctx.fillStyle = '#ffdbac';
    ctx.fillRect(bx - 2, by - 50, 14, 15);

    // Water Ripples
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bx + 5, by + 30, 30, 0, Math.PI);
    ctx.stroke();

  } else {
    // --- BIRD'S-EYE VIEW MODE ---
    
    // Grass Field
    ctx.fillStyle = '#419834';
    ctx.fillRect(0, 0, 580, canvas.height);

    // Water Zone on Right
    ctx.fillStyle = '#2b65ec';
    ctx.fillRect(580, 0, 220, canvas.height);

    // Secret Portal (Top-Down)
    ctx.fillStyle = secretUnlocked ? '#9b59b6' : '#2c3e50';
    ctx.beginPath();
    ctx.arc(400, 80, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = secretUnlocked ? '#f1c40f' : '#7f8c8d';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(secretUnlocked ? 'PORTAL OPEN!' : 'Secret Portal', 400, 45);

    // Targets (Top-Down)
    targets.forEach(t => {
      ctx.fillStyle = t.hit ? '#7f8c8d' : '#e74c3c';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
      ctx.fill();
    });

    // Arrows
    ctx.fillStyle = '#1a1a1a';
    arrows.forEach(a => {
      ctx.beginPath();
      ctx.arc(a.x, a.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });

    // Top-Down Player Character
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    // Body
    ctx.fillStyle = player.equippedArmour ? '#a0a0a0' : '#ff7b7b';
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Shoulders / Hands
    ctx.fillStyle = '#ffdbac';
    ctx.beginPath();
    ctx.arc(12, -10, 5, 0, Math.PI * 2);
    ctx.arc(12, 10, 5, 0, Math.PI * 2);
    ctx.fill();

    // Bow (Top-Down view held forward)
    if (player.equippedBow) {
      ctx.strokeStyle = '#8b4513';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(15, 0, 14, -Math.PI / 3, Math.PI / 3);
      ctx.stroke();
    }

    ctx.restore();
  }

  requestAnimationFrame(() => {
    update();
    draw();
  });
}

draw();
</script>
</body>
</html>
