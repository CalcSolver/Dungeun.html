<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Region Quest - Full Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background: #0f111a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      border: 4px solid #2a2e3d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background: #181a24;
    }
    canvas {
      display: block;
      background: #111;
    }
    #ui-bar {
      width: 100%;
      background: #181a24;
      border-top: 2px solid #2a2e3d;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    .hud-element {
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bar-bg {
      width: 100px;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #555;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      background: #ff3e3e;
      transition: width 0.1s ease;
    }
    #log-box {
      width: 800px;
      margin-top: 10px;
      padding: 12px;
      background: #181a24;
      border: 2px solid #2a2e3d;
      border-radius: 6px;
      color: #ffd700;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .controls-hint {
      margin-top: 8px;
      color: #8a8f9d;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="480"></canvas>
    <div id="ui-bar">
      <div class="hud-element">
        <span>PLAYER HP:</span>
        <div class="bar-bg"><div id="player-hp-bar" class="bar-fill"></div></div>
      </div>
      <div class="hud-element" id="region-display">
        <span>REGION:</span> <span id="region-name" style="color: #00E5FF;">Grassland</span>
      </div>
      <div class="hud-element">
        <span>KEY:</span> <span id="key-status" style="color: #ff5555;">Locked 🔒</span>
      </div>
    </div>
  </div>

  <div id="log-box">Use WASD or ARROW KEYS to move. Press SPACEBAR to attack!</div>
  <div class="controls-hint">Controls: WASD/Arrows = Walk | SPACE = Sword Attack | Walk into NPCs to talk</div>

<script>
// ==========================================
// GAME CONSTANTS & CONFIGURATION
// ==========================================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const logBox = document.getElementById("log-box");
const regionNameEl = document.getElementById("region-name");
const keyStatusEl = document.getElementById("key-status");
const playerHpBar = document.getElementById("player-hp-bar");

// Global NPC Style Rule: ALL NPCs share this exact signature color
const NPC_GLOBAL_COLOR = "#00E5FF";

// Sound/Effect Helper
function log(msg) {
  logBox.textContent = msg;
}

// ==========================================
// INPUT HANDLING
// ==========================================
const keys = {
  up: false,
  down: false,
  left: false,
  right: false,
  space: false,
  spacePressed: false
};

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keys.up = true;
  if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keys.down = true;
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
  if (e.key === " " || e.key === "Spacebar") {
    if (!keys.space) keys.spacePressed = true;
    keys.space = true;
  }
});

window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keys.up = false;
  if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keys.down = false;
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  if (e.key === " " || e.key === "Spacebar") {
    keys.space = false;
    keys.spacePressed = false;
  }
});

// ==========================================
// PLAYER ENTITY
// ==========================================
const player = {
  x: 60,
  y: 220,
  width: 28,
  height: 28,
  speed: 3.5,
  color: "#FFEA00",
  maxHp: 100,
  hp: 100,
  facing: "right",
  isAttacking: false,
  attackTimer: 0,
  attackBox: { x: 0, y: 0, width: 30, height: 30 },
  
  reset(x, y) {
    this.x = x;
    this.y = y;
    this.hp = this.maxHp;
    this.isAttacking = false;
  },

  update() {
    let dx = 0;
    let dy = 0;

    if (keys.up) { dy -= this.speed; this.facing = "up"; }
    if (keys.down) { dy += this.speed; this.facing = "down"; }
    if (keys.left) { dx -= this.speed; this.facing = "left"; }
    if (keys.right) { dx += this.speed; this.facing = "right"; }

    // Check X movement collision
    let nextX = this.x + dx;
    if (!checkWallCollision(nextX, this.y, this.width, this.height)) {
      this.x = nextX;
    }

    // Check Y movement collision
    let nextY = this.y + dy;
    if (!checkWallCollision(this.x, nextY, this.width, this.height)) {
      this.y = nextY;
    }

    // Keep within Screen Bounds
    this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));
    this.y = Math.max(0, Math.min(canvas.height - this.height, this.y));

    // Attack Trigger
    if (keys.spacePressed && !this.isAttacking) {
      this.isAttacking = true;
      this.attackTimer = 12; // attack duration frames
      keys.spacePressed = false;
    }

    if (this.isAttacking) {
      this.attackTimer--;
      if (this.attackTimer <= 0) {
        this.isAttacking = false;
      }
    }

    // Update Attack Hitbox Coordinates based on facing direction
    if (this.facing === "right") {
      this.attackBox = { x: this.x + this.width, y: this.y - 4, width: 24, height: 36 };
    } else if (this.facing === "left") {
      this.attackBox = { x: this.x - 24, y: this.y - 4, width: 24, height: 36 };
    } else if (this.facing === "up") {
      this.attackBox = { x: this.x - 4, y: this.y - 24, width: 36, height: 24 };
    } else if (this.facing === "down") {
      this.attackBox = { x: this.x - 4, y: this.y + this.height, width: 36, height: 24 };
    }

    // Update UI Bar
    const hpPercent = Math.max(0, (this.hp / this.maxHp) * 100);
    playerHpBar.style.width = hpPercent + "%";
  },

  draw() {
    // Attack Swing Effect
    if (this.isAttacking) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.fillRect(this.attackBox.x, this.attackBox.y, this.attackBox.width, this.attackBox.height);
    }

    // Main Player Body
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);

    // Direction Eye Indicator
    ctx.fillStyle = "#000";
    if (this.facing === "right") ctx.fillRect(this.x + 20, this.y + 6, 5, 5);
    if (this.facing === "left") ctx.fillRect(this.x + 3, this.y + 6, 5, 5);
    if (this.facing === "up") ctx.fillRect(this.x + 11, this.y + 3, 6, 5);
    if (this.facing === "down") ctx.fillRect(this.x + 11, this.y + 20, 6, 5);
  }
};

// ==========================================
// REGIONS & WORLD MAP DATA
// ==========================================
let currentRegionId = 1;
let highestUnlockedRegion = 1;

const regions = {
  1: {
    name: "Grassland Haven",
    bg: "#1e3d20",
    spawnX: 50,
    spawnY: 220,
    walls: [
      { x: 180, y: 0, w: 30, h: 300 },
      { x: 180, y: 380, w: 30, h: 100 },
      { x: 420, y: 100, w: 30, h: 380 },
      { x: 300, y: 220, w: 120, h: 30 }
    ],
    npcs: [
      { x: 100, y: 100, w: 26, h: 26, name: "Guide Pip", dialogue: "Defeat the Red Golem at the east gate to unlock Region 2!" },
      { x: 100, y: 360, w: 26, h: 26, name: "Scout Ray", dialogue: "Stay away from the walls, you can't walk through solid stone!" }
    ],
    boss: {
      x: 650,
      y: 200,
      w: 48,
      h: 48,
      name: "Grassland Golem",
      color: "#ff3333",
      maxHp: 60,
      hp: 60,
      speed: 1.2,
      defeated: false
    },
    gate: { x: 760, y: 180, w: 40, h: 120, leadsTo: 2 }
  },
  2: {
    name: "Volcano Caldera",
    bg: "#4a1515",
    spawnX: 60,
    spawnY: 220,
    walls: [
      { x: 220, y: 100, w: 360, h: 30 },
      { x: 220, y: 320, w: 360, h: 30 },
      { x: 380, y: 130, w: 40, h: 190 }
    ],
    npcs: [
      { x: 100, y: 380, w: 26, h: 26, name: "Lava Hermit", dialogue: "The Obsidian Dragon in this region is ruthless! Use SPACE to attack!" }
    ],
    boss: {
      x: 660,
      y: 200,
      w: 56,
      h: 56,
      name: "Obsidian Dragon",
      color: "#d500f9",
      maxHp: 120,
      hp: 120,
      speed: 1.8,
      defeated: false
    },
    gate: { x: 760, y: 180, w: 40, h: 120, leadsTo: 3 }
  },
  3: {
    name: "Frost Citadel",
    bg: "#102a43",
    spawnX: 60,
    spawnY: 220,
    walls: [
      { x: 150, y: 0, w: 30, h: 200 },
      { x: 150, y: 280, w: 30, h: 200 },
      { x: 500, y: 0, w: 30, h: 200 },
      { x: 500, y: 280, w: 30, h: 200 }
    ],
    npcs: [
      { x: 80, y: 80, w: 26, h: 26, name: "Frost Guard", dialogue: "You made it to the final realm! Defeat the Frost King to win!" }
    ],
    boss: {
      x: 640,
      y: 210,
      w: 60,
      h: 60,
      name: "Frost King",
      color: "#00e676",
      maxHp: 200,
      hp: 200,
      speed: 2.2,
      defeated: false
    },
    gate: { x: 760, y: 180, w: 40, h: 120, leadsTo: null }
  }
};

// ==========================================
// COLLISION DETECTOR (RECTANGLE OVERLAP)
// ==========================================
function intersects(r1, r2) {
  return !(
    r2.x >= r1.x + r1.w ||
    r2.x + r2.w <= r1.x ||
    r2.y >= r1.y + r1.h ||
    r2.y + r2.h <= r1.y
  );
}

// Checks if a given rectangle collides with any walls in current region
function checkWallCollision(x, y, w, h) {
  const currentWalls = regions[currentRegionId].walls;
  const box = { x: x, y: y, w: w, h: h };

  for (let wall of currentWalls) {
    if (intersects(box, wall)) {
      return true;
    }
  }
  return false;
}

// ==========================================
// GAME LOGIC & UPDATE LOOP
// ==========================================
function updateGame() {
  const reg = regions[currentRegionId];
  
  // Update Player Position & Actions
  player.update();

  // NPC Interaction Check
  const playerBox = { x: player.x, y: player.y, w: player.width, h: player.height };
  for (let npc of reg.npcs) {
    if (intersects(playerBox, npc)) {
      log(`💬 ${npc.name}: "${npc.dialogue}"`);
    }
  }

  // Boss Logic
  const boss = reg.boss;
  if (!boss.defeated) {
    const bossBox = { x: boss.x, y: boss.y, w: boss.w, h: boss.h };

    // Boss Simple Chase AI
    if (player.x < boss.x) boss.x -= boss.speed * 0.5;
    if (player.x > boss.x) boss.x += boss.speed * 0.5;
    if (player.y < boss.y) boss.y -= boss.speed * 0.5;
    if (player.y > boss.y) boss.y += boss.speed * 0.5;

    // Check Player Attacking Boss
    if (player.isAttacking) {
      const attackBoxRect = { x: player.attackBox.x, y: player.attackBox.y, w: player.attackBox.width, h: player.attackBox.height };
      if (intersects(attackBoxRect, bossBox)) {
        boss.hp -= 2;
        // Knockback Boss slightly
        if (player.facing === "right") boss.x += 8;
        if (player.facing === "left") boss.x -= 8;
        if (player.facing === "up") boss.y -= 8;
        if (player.facing === "down") boss.y += 8;

        log(`⚔️ You hit ${boss.name}! Boss HP: ${Math.max(0, boss.hp)}/${boss.maxHp}`);

        if (boss.hp <= 0) {
          boss.defeated = true;
          if (reg.gate.leadsTo) {
            highestUnlockedRegion = Math.max(highestUnlockedRegion, reg.gate.leadsTo);
            log(`🎉 ${boss.name} DEFEATED! Region ${reg.gate.leadsTo} gate is now UNLOCKED!`);
          } else {
            log(`🏆 YOU DEFEATED THE FINAL BOSS! YOU WIN THE GAME!`);
          }
        }
      }
    }

    // Boss Collides with Player (Damage Player)
    if (intersects(playerBox, bossBox)) {
      player.hp -= 0.8;
      log(`🔥 ${boss.name} hits you! HP remaining: ${Math.ceil(player.hp)}`);
      
      if (player.hp <= 0) {
        log(`☠️ You died! Respawning at region start...`);
        player.reset(reg.spawnX, reg.spawnY);
      }
    }
  }

  // Region Gate Transition Check
  const gate = reg.gate;
  if (intersects(playerBox, gate)) {
    if (!boss.defeated) {
      log(`🔒 GATE LOCKED! You must defeat ${boss.name} to enter the next region!`);
      player.x -= 10; // Push player back from gate
    } else if (gate.leadsTo) {
      currentRegionId = gate.leadsTo;
      const nextReg = regions[currentRegionId];
      player.reset(nextReg.spawnX, nextReg.spawnY);
      log(`🌌 Entered ${nextReg.name}! Defeat the local boss to proceed!`);
    } else {
      log(`✨ You have cleared every region in the realm! Victory!`);
    }
  }

  // Update UI Elements
  regionNameEl.textContent = reg.name;
  if (boss.defeated) {
    keyStatusEl.textContent = "Unlocked 🔓";
    keyStatusEl.style.color = "#00E676";
  } else {
    keyStatusEl.textContent = "Locked 🔒";
    keyStatusEl.style.color = "#ff5555";
  }
}

// ==========================================
// RENDER / DRAW LOOP
// ==========================================
function drawGame() {
  const reg = regions[currentRegionId];

  // 1. Draw Background
  ctx.fillStyle = reg.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 2. Draw Walls (Impassable obstacles)
  ctx.fillStyle = "#2a2e3d";
  for (let wall of reg.walls) {
    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    // Wall border highlight
    ctx.strokeStyle = "#444b63";
    ctx.lineWidth = 2;
    ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
  }

  // 3. Draw Gate / Portal
  const boss = reg.boss;
  ctx.fillStyle = boss.defeated ? "#00E676" : "#ff3333";
  ctx.fillRect(reg.gate.x, reg.gate.y, reg.gate.w, reg.gate.h);
  
  ctx.fillStyle = "#fff";
  ctx.font = "10px sans-serif";
  ctx.fillText(boss.defeated ? "EXIT" : "LOCKED", reg.gate.x + 2, reg.gate.y + 60);

  // 4. Draw NPCs (UNIFIED NPC COLOR IMPLEMENTATION)
  for (let npc of reg.npcs) {
    ctx.fillStyle = NPC_GLOBAL_COLOR; // Single source of truth for NPC color
    ctx.fillRect(npc.x, npc.y, npc.w, npc.h);

    // NPC Label
    ctx.fillStyle = "#fff";
    ctx.font = "11px sans-serif";
    ctx.fillText(npc.name, npc.x - 10, npc.y - 6);
  }

  // 5. Draw Boss (If active)
  if (!boss.defeated) {
    ctx.fillStyle = boss.color;
    ctx.fillRect(boss.x, boss.y, boss.w, boss.h);

    // Boss Name
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText(boss.name, boss.x - 10, boss.y - 12);

    // Boss HP Bar above head
    const hpRatio = Math.max(0, boss.hp / boss.maxHp);
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(boss.x, boss.y - 8, boss.w, 5);
    ctx.fillStyle = "#ff3333";
    ctx.fillRect(boss.x, boss.y - 8, boss.w * hpRatio, 5);
  }

  // 6. Draw Player
  player.draw();
}

// ==========================================
// MAIN LOOP ENGINE
// ==========================================
function gameLoop() {
  updateGame();
  drawGame();
  requestAnimationFrame(gameLoop);
}

// Start Game
log(`Welcome! Move with WASD/Arrows and defeat the ${regions[1].boss.name} to unlock Region 2!`);
gameLoop();
</script>

</body>
</html>
