<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Explorer - Cube Intro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #intro-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #08080d;
            border: 3px solid #2a2a38;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
            perspective: 1000px;
        }

        /* Ambient Glow */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(142, 68, 173, 0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }

        /* 3D Scene Space */
        .scene {
            width: 140px;
            height: 140px;
            position: relative;
            transform-style: preserve-3d;
            transform: translateY(-20px) rotateX(-20deg) rotateY(25deg);
            z-index: 2;
        }

        /* 3D Cube */
        .cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform-origin: center center;
            opacity: 0;
        }

        /* Cube Faces representing 4 Regions */
        .face {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 3px solid #fff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            background-size: cover;
        }

        .face-icon { font-size: 38px; margin-bottom: 4px; }

        /* Region 1: Lava Citadel (Front) */
        .face-front { 
            transform: translateZ(70px); 
            background: linear-gradient(135deg, #e74c3c, #900c3f);
            border-color: #ff7675;
            color: #ffeaa7;
        }
        /* Region 2: Ice Cavern (Right) */
        .face-right { 
            transform: rotateY(90deg) translateZ(70px); 
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            border-color: #74b9ff;
            color: #dff9fb;
        }
        /* Region 3: Toxic Swamps (Back) */
        .face-back { 
            transform: rotateY(180deg) translateZ(70px); 
            background: linear-gradient(135deg, #27ae60, #117864);
            border-color: #55efc4;
            color: #55efc4;
        }
        /* Region 4: Shadow Crypts (Left) */
        .face-left { 
            transform: rotateY(-90deg) translateZ(70px); 
            background: linear-gradient(135deg, #8e44ad, #2c3e50);
            border-color: #a29bfe;
            color: #fd79a8;
        }
        /* Top Face */
        .face-top { 
            transform: rotateX(90deg) translateZ(70px); 
            background: #2d3436;
            border-color: #636e72;
        }
        /* Bottom Face */
        .face-bottom { 
            transform: rotateX(-90deg) translateZ(70px); 
            background: #000;
            border-color: #333;
        }

        /* Title Card */
        .game-title {
            font-size: 42px;
            font-weight: 900;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 35px;
            opacity: 0;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.6), 3px 3px 0px #000;
            z-index: 2;
            text-align: center;
        }

        /* Progress Bar (15s Visual) */
        .timer-container {
            position: absolute;
            bottom: 25px;
            width: 60%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .timer-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #8e44ad, #f1c40f);
        }

        .skip-btn {
            position: absolute;
            bottom: 45px;
            padding: 6px 14px;
            background: transparent;
            border: 2px solid #555;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
            transition: all 0.2s;
            z-index: 5;
        }
        .skip-btn:hover { border-color: #f1c40f; color: #fff; }

        /* Animations */
        @keyframes pulseGlow {
            0% { transform: scale(0.8); opacity: 0.3; }
            100% { transform: scale(1.3); opacity: 0.6; }
        }

        /* GameCube-style Bounce & Roll Entrance Sequence */
        @keyframes cubeRollIn {
            0% {
                opacity: 0;
                transform: translateY(-300px) scale(0.2) rotateX(720deg) rotateY(360deg);
            }
            30% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(360deg) rotateY(180deg);
            }
            45% {
                transform: translateY(-60px) rotateX(270deg) rotateY(90deg);
            }
            60% {
                transform: translateY(0) rotateX(180deg) rotateY(0deg);
            }
            75% {
                transform: translateY(-20px) rotateX(90deg) rotateY(-90deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateX(0deg) rotateY(0deg);
            }
        }

        /* Continuous Showcase Rotation */
        @keyframes cubeSpinShowcase {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            25% { transform: rotateX(0deg) rotateY(-90deg); }   /* Show Ice */
            50% { transform: rotateX(0deg) rotateY(-180deg); }  /* Show Swamps */
            75% { transform: rotateX(0deg) rotateY(-270deg); }  /* Show Crypts */
            100% { transform: rotateX(0deg) rotateY(-360deg); } /* Back to Lava */
        }

        @keyframes titleSlam {
            0% { opacity: 0; transform: scale(2) translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        @keyframes timerFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes fadeOutAll {
            0% { opacity: 1; filter: brightness(1); }
            100% { opacity: 0; filter: brightness(2); }
        }
    </style>
</head>
<body>

    <div id="intro-container">
        <div class="bg-glow"></div>
        
        <div class="scene">
            <div id="cube" class="cube">
                <!-- Region 1 -->
                <div class="face face-front">
                    <span class="face-icon">🔥</span>
                    <span>LAVA</span>
                </div>
                <!-- Region 2 -->
                <div class="face face-right">
                    <span class="face-icon">❄️</span>
                    <span>ICE</span>
                </div>
                <!-- Region 3 -->
                <div class="face face-back">
                    <span class="face-icon">☣️</span>
                    <span>SWAMP</span>
                </div>
                <!-- Region 4 -->
                <div class="face face-left">
                    <span class="face-icon">💀</span>
                    <span>CRYPT</span>
                </div>
                <!-- Tops/Bottom -->
                <div class="face face-top"></div>
                <div class="face face-bottom"></div>
            </div>
        </div>

        <div id="title" class="game-title">Dungeon Explorer</div>

        <div class="timer-container">
            <div id="progress" class="timer-bar"></div>
        </div>

        <button class="skip-btn" onclick="finishIntro()">SKIP INTRO</button>
    </div>

    <script>
        const cube = document.getElementById('cube');
        const title = document.getElementById('title');
        const progress = document.getElementById('progress');
        const container = document.getElementById('intro-container');

        // Timeline Trigger (15-second GameCube Sequence)

        // 0.0s: Start Timer Bar
        progress.style.animation = 'timerFill 15s linear forwards';

        // 1.0s: Cube drops down, bounces, and lands (GameCube-style rolling entry)
        setTimeout(() => {
            cube.style.animation = 'cubeRollIn 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards';
        }, 1000);

        // 5.0s: Cube slowly rotates through each of the 4 region faces
        setTimeout(() => {
            cube.style.animation = 'cubeSpinShowcase 6.5s ease-in-out forwards';
        }, 5000);

        // 9.5s: Slam the main title onto the screen as the cube finishes rotating
        setTimeout(() => {
            title.style.animation = 'titleSlam 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
        }, 9500);

        // 14.0s: Flash/Fade out sequence
        setTimeout(() => {
            container.style.animation = 'fadeOutAll 1s ease-out forwards';
        }, 14000);

        // 15.0s: Transition complete
        setTimeout(() => {
            finishIntro();
        }, 15000);

        function finishIntro() {
            container.style.animation = 'none';
            container.innerHTML = '<h2 style="color: #2ecc71; letter-spacing: 3px; font-size: 28px;">PRESS START</h2>';
        }
    </script>
</body>
</html>
